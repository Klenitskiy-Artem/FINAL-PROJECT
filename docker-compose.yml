services:
  # База данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: kinostream-db
    environment:
      POSTGRES_DB: kinostream
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Наше Spring Boot приложение
  backend:
    build: .
    container_name: kinostream-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/kinostream
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password

volumes:
  pgdata: