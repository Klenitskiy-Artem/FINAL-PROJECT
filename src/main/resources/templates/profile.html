<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой профиль - KinoStream</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Контейнер в две колонки строго по горизонтали */
        .profile-layout {
            max-width: 960px;
            width: 100%;
            margin: 50px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 30px;
            box-sizing: border-box;
        }

        /* Левая карточка: настройки профиля */
        .settings-card {
            flex: 1 1 480px;
            max-width: 480px;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        /* Правая карточка: блок подписки */
        .subscription-side-card {
            width: 340px;
            flex-shrink: 0;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #2e2e2e;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .subscription-side-card:hover {
            border-color: #444;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #ccc; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px 12px; border-radius: 4px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: #e50914; }

        .btn-save { background-color: #e50914; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; transition: 0.2s; }
        .btn-save:hover { background-color: #f6121d; }

        /* Кнопка отмены подписки */
        .btn-cancel-sub {
            margin-top: 10px;
            background-color: transparent;
            color: #999;
            border: 1px solid #444;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 14px;
            transition: 0.2s;
            display: none; /* Показывается только если есть активная подписка */
        }
        .btn-cancel-sub:hover {
            background-color: #2a2a2a;
            color: #ff4d4d;
            border-color: #ff4d4d;
        }

        /* Стили модального окна "Вы уверены?" */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-box {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 25px 30px;
            max-width: 360px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
        }
        .modal-box h3 {
            margin-top: 0;
            font-size: 20px;
            color: #fff;
        }
        .modal-box p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        .btn-confirm-yes {
            flex: 1;
            background-color: #e50914;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-confirm-yes:hover { background-color: #f6121d; }
        .btn-confirm-no {
            flex: 1;
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-confirm-no:hover { background-color: #444; }
    </style>
</head>
<body class="auth-body">

<div class="header">
    <a href="/" class="logo" style="text-decoration: none;">KinoStream</a>
    <div class="nav-menu">
        <a href="/?category=Фильм">Фильмы</a>
        <a href="/?category=Сериал">Сериалы</a>
        <a href="/bookmarks">Мои закладки</a>
    </div>
    <div class="auth-buttons" id="authSection"></div>
</div>

<div class="profile-layout">
    <!-- ЛЕВАЯ КОЛОНКА: Настройки профиля -->
    <div class="settings-card">
        <h2 style="margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 12px;">Настройки профиля</h2>

        <div class="form-group">
            <label>Ваш Email (нельзя изменить)</label>
            <input type="text" id="profileEmail" disabled style="color: #888; cursor: not-allowed;">
        </div>

        <form id="updateProfileForm">
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="profileUsername" required>
            </div>

            <div class="form-group">
                <label>Текущий пароль</label>
                <input type="password" id="profileOldPassword" placeholder="Введите текущий пароль">
            </div>

            <div class="form-group">
                <label>Новый пароль</label>
                <input type="password" id="profileNewPassword" placeholder="Введите новый пароль">
            </div>

            <button type="submit" class="btn-save">Сохранить изменения</button>
        </form>
        <p id="profileMessage" style="margin-top: 15px; font-weight: bold; text-align: center;"></p>
    </div>

    <!-- ПРАВАЯ КОЛОНКА: Статус подписки и управление -->
    <div class="subscription-side-card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 12px; margin-bottom: 15px;">
            <h2 style="margin: 0; font-size: 20px;">Подписка</h2>
            <span id="subBadge" style="background-color: #333; color: #aaa; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold;">
                ЗАГРУЗКА...
            </span>
        </div>

        <p id="subDaysLeft" style="color: #ccc; font-size: 15px; line-height: 1.5; margin: 0 0 20px 0;">
            Проверяем статус...
        </p>

        <button type="button" class="btn-save" onclick="window.location.href='/subscription'">
            Купить / Продлить подписку →
        </button>

        <!-- Кнопка отмены подписки -->
        <button type="button" id="cancelSubBtn" class="btn-cancel-sub" onclick="openCancelModal()">
            Отменить подписку
        </button>
    </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ ОТМЕНЫ -->
<div class="modal-overlay" id="cancelModal">
    <div class="modal-box">
        <h3>Вы уверены?</h3>
        <p>При отмене подписки вы сразу потеряете доступ к качеству 720p HD и 1080p Full HD.</p>
        <div class="modal-actions">
            <button type="button" class="btn-confirm-yes" onclick="confirmCancelSubscription()">Да</button>
            <button type="button" class="btn-confirm-no" onclick="closeCancelModal()">Нет</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const email = localStorage.getItem('userEmail');
        if (!email) {
            window.location.href = '/login';
            return;
        }

        document.getElementById('authSection').innerHTML = `
            <span id="headerUsername" style="color: #ccc; margin-right: 15px; font-weight: bold;">${email}</span>
            <a href="#" onclick="logout()" class="btn-login" style="background-color: #333;">Выйти</a>
        `;

        loadProfileData();
    });

    function loadProfileData() {
        const email = localStorage.getItem('userEmail');
        fetch(`/api/profile?email=${encodeURIComponent(email)}`, { cache: 'no-store' })
            .then(res => {
                if (res.status === 404) {
                    localStorage.removeItem('userEmail');
                    window.location.href = '/login';
                    return null;
                }
                return res.json();
            })
            .then(data => {
                if (!data) return;

                document.getElementById('profileEmail').value = data.email;
                document.getElementById('profileUsername').value = data.username;
                document.getElementById('headerUsername').textContent = data.username;

                const subBadge = document.getElementById('subBadge');
                const subDaysLeft = document.getElementById('subDaysLeft');
                const cancelSubBtn = document.getElementById('cancelSubBtn');

                if (data.subStatus === 'PREMIUM') {
                    subBadge.textContent = `PRO: осталось ${data.daysLeft} дн.`;
                    subBadge.style.backgroundColor = '#f3ce13';
                    subBadge.style.color = '#000';
                    subDaysLeft.innerHTML = `Статус: <strong style="color: #f3ce13;">Активна (Full HD 1080p)</strong>`;
                    cancelSubBtn.style.display = 'block';
                } else if (data.subStatus === 'TRIAL') {
                    subBadge.textContent = `TRIAL: осталось ${data.daysLeft} дн.`;
                    subBadge.style.backgroundColor = '#4caf50';
                    subBadge.style.color = '#fff';
                    subDaysLeft.innerHTML = `Статус: <strong style="color: #4caf50;">Пробный период (3 дня)</strong>`;
                    cancelSubBtn.style.display = 'block';
                } else {
                    subBadge.textContent = 'FREE (480p)';
                    subBadge.style.backgroundColor = '#333';
                    subBadge.style.color = '#aaa';
                    subDaysLeft.innerHTML = `Статус: <strong style="color: #aaa;">Подписка не активна</strong>`;
                    cancelSubBtn.style.display = 'none';
                }
            });
    }

    // Открыть окно "Вы уверены?"
    function openCancelModal() {
        document.getElementById('cancelModal').style.display = 'flex';
    }

    // Нажали "Нет" — закрываем окно и остаемся в профиле
    function closeCancelModal() {
        document.getElementById('cancelModal').style.display = 'none';
    }

    // Нажали "Да" — отменяем подписку
    async function confirmCancelSubscription() {
        const email = localStorage.getItem('userEmail');
        try {
            const response = await fetch('/api/profile/cancel-subscription', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            if (response.ok) {
                closeCancelModal();
                loadProfileData(); // Мгновенно обновляем статус карточки на FREE (480p)
            } else {
                alert('Ошибка при отмене подписки');
            }
        } catch (err) {
            alert('Сбой соединения с сервером');
        }
    }

    function logout() {
        localStorage.removeItem('userEmail');
        window.location.href = '/';
    }

    document.getElementById('updateProfileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const messageBox = document.getElementById('profileMessage');
        const email = document.getElementById('profileEmail').value;
        const newUsername = document.getElementById('profileUsername').value;
        const oldPassword = document.getElementById('profileOldPassword').value;
        const newPassword = document.getElementById('profileNewPassword').value;

        try {
            const response = await fetch('/api/profile/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: email,
                    username: newUsername,
                    oldPassword: oldPassword,
                    newPassword: newPassword
                })
            });

            if (response.ok) {
                messageBox.style.color = '#4caf50';
                messageBox.textContent = 'Профиль успешно обновлен!';
                document.getElementById('headerUsername').textContent = newUsername;
                document.getElementById('profileOldPassword').value = '';
                document.getElementById('profileNewPassword').value = '';
            } else {
                const errorText = await response.text();
                messageBox.style.color = '#ff4d4d';
                messageBox.textContent = errorText;
            }
        } catch (err) {
            messageBox.style.color = '#ff4d4d';
            messageBox.textContent = 'Сбой сети';
        }
    });
</script>
</body>
</html>
